{% extends "base.html" %}
{% block title %}Log in - Guess the Word{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <form method="post">
    <label>Username
      <input type="text" name="username" required autofocus autocomplete="username">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit">Log in</button>
  </form>
  <p class="hint">New player? <a href="{{ url_for('register') }}">Register here</a>.</p>
</section>
{% endblock %}
